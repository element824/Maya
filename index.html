<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maya</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="grain"></div>

  <nav>
    <span class="logo">maya.</span>
    <ul>
      <li><a href="#home">home</a></li>
      <li><a href="#gallery">gallery</a></li>
      <li><a href="#contact">contact</a></li>
    </ul>
  </nav>

  <section id="home" class="hero">
    <div class="hero-content">
      <h1>Maya</h1>
      <div class="marquee">
        <span>welcome — welcome — welcome — welcome — welcome —&nbsp;</span>
        <span>welcome — welcome — welcome — welcome — welcome —&nbsp;</span>
      </div>
    </div>
  </section>

  <section id="gallery" class="gallery">
    <h2>gallery</h2>
    <div class="grid">
      <div class="grid-item">
        <div class="placeholder-img" style="--hue: 25;"></div>
        <p class="caption">no. 01</p>
      </div>
      <div class="grid-item">
        <div class="placeholder-img" style="--hue: 340;"></div>
        <p class="caption">no. 02</p>
      </div>
      <div class="grid-item">
        <div class="placeholder-img" style="--hue: 200;"></div>
        <p class="caption">no. 03</p>
      </div>
      <div class="grid-item">
        <div class="placeholder-img" style="--hue: 55;"></div>
        <p class="caption">no. 04</p>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>say hi</h2>
    <form onsubmit="handleSubmit(event)">
      <input type="text" placeholder="name" required />
      <input type="email" placeholder="email" required />
      <textarea placeholder="message" rows="4" required></textarea>
      <button type="submit" class="btn">send</button>
    </form>
    <p id="form-msg" class="form-msg"></p>
  </section>

  <footer>
    <p>maya — 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
